<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Convertidor MP3 a MP4 v1.0.9</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #121212;
      color: #e0e0e0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 1.5rem;
      font-size: 18px;
    }
    .card {
      background: #1e1e1e;
      padding: 2.5rem 2rem;
      border-radius: 16px;
      box-shadow: 0 12px 32px rgba(0,0,0,0.6);
      width: 100%;
      max-width: 640px;
      text-align: center;
    }
    .version-tag {
      display: inline-block;
      background: #2563eb;
      color: #ffffff;
      font-size: 0.85rem;
      font-weight: bold;
      padding: 4px 10px;
      border-radius: 6px;
      vertical-align: middle;
      margin-left: 8px;
    }
    h2 { margin-top: 0; color: #fff; font-size: 2rem; display: flex; align-items: center; justify-content: center; }
    input[type="file"] { display: none; }
    .btn {
      display: block;
      background: #3b82f6;
      color: white;
      padding: 18px 24px;
      border-radius: 12px;
      cursor: pointer;
      font-weight: bold;
      font-size: 1.25rem;
      margin-top: 1.5rem;
      border: none;
      width: 100%;
      text-decoration: none;
    }
    .btn:hover { background: #2563eb; }
    .btn:disabled { background: #4b5563; cursor: not-allowed; opacity: 0.7; }
    .engine-badge {
      display: inline-block;
      padding: 8px 18px;
      border-radius: 20px;
      font-size: 1rem;
      font-weight: bold;
      margin-bottom: 1.5rem;
      background: #374151;
      color: #9ca3af;
    }
    .engine-badge.ready { background: #065f46; color: #34d399; }
    .progress-container {
      width: 100%;
      background-color: #374151;
      border-radius: 12px;
      overflow: hidden;
      margin-top: 1.5rem;
      display: none;
      height: 28px;
      position: relative;
    }
    .progress-bar {
      width: 0%;
      height: 100%;
      background-color: #10b981;
      transition: width 0.2s linear;
    }
    .progress-text {
      position: absolute;
      width: 100%;
      top: 0; left: 0;
      font-size: 1rem;
      font-weight: bold;
      line-height: 28px;
      color: #ffffff;
      text-shadow: 0 1px 3px rgba(0,0,0,0.9);
    }
    #status { margin-top: 1.5rem; font-size: 1.1rem; color: #cbd5e1; word-break: break-all; }
    #preview { margin-top: 1.5rem; max-width: 260px; width: 100%; border-radius: 12px; display: none; margin: 1.5rem auto 0; }
    canvas { display: none; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jsmediatags/3.9.5/jsmediatags.min.js"></script>
</head>
<body>

<div class="card">
  <h2>MP3 a MP4 <span class="version-tag">v1.0.9</span></h2>
  <div id="engineStatus" class="engine-badge">Cargando motor MP4...</div>
  
  <br>
  <label for="audioFile" id="fileLabel" class="btn" style="opacity: 0.5; pointer-events: none;">Seleccionar Archivo MP3</label>
  <input type="file" id="audioFile" accept="audio/mp3, audio/*">
  
  <img id="preview" alt="Carátula detectada">
  
  <div class="progress-container" id="progressContainer">
    <div class="progress-bar" id="progressBar"></div>
    <div class="progress-text" id="progressText">0%</div>
  </div>

  <div id="status">Cargando componentes de video...</div>
  
  <button id="convertBtn" class="btn" style="background: #10b981; display: none;">Convertir a MP4</button>
  <a id="downloadLink" class="btn" style="background: #8b5cf6; display: none;">Descargar Video (.mp4)</a>
  
  <canvas id="canvas" width="1920" height="1080"></canvas>
</div>

<script type="module">
  import { createFFmpeg, fetchFile } from 'https://unpkg.com/@ffmpeg/ffmpeg@0.11.6/dist/ffmpeg.min.js';

  const jsMediaTags = window.jsmediatags;
  const ffmpeg = createFFmpeg({ log: false });

  const engineStatus = document.getElementById('engineStatus');
  const fileLabel = document.getElementById('fileLabel');
  const fileInput = document.getElementById('audioFile');
  const status = document.getElementById('status');
  const convertBtn = document.getElementById('convertBtn');
  const downloadLink = document.getElementById('downloadLink');
  const preview = document.getElementById('preview');
  const progressContainer = document.getElementById('progressContainer');
  const progressBar = document.getElementById('progressBar');
  const progressText = document.getElementById('progressText');
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');

  let selectedFile = null;
  let coverImage = null;

  window.addEventListener('load', async () => {
    try {
      status.innerText = "Inicializando motor de renderizado MP4...";
      await ffmpeg.load();
      engineStatus.innerText = "Motor MP4 Listo";
      engineStatus.className = "engine-badge ready";
      status.innerText = "Selecciona un archivo MP3 para comenzar.";
      fileLabel.style.opacity = "1";
      fileLabel.style.pointerEvents = "auto";
    } catch (err) {
      console.error(err);
      engineStatus.innerText = "Error de motor";
      status.innerText = "Tu navegador no permite la aceleración MP4 local.";
    }
  });

  fileInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;

    selectedFile = file;
    status.innerText = `Lectura de metadatos: ${file.name}...`;
    convertBtn.style.display = "none";
    downloadLink.style.display = "none";
    preview.style.display = "none";
    progressContainer.style.display = "none";
    coverImage = null;

    jsMediaTags.read(file, {
      onSuccess: function(tag) {
        const picture = tag.tags.picture;
        if (picture) {
          let base64String = "";
          for (let i = 0; i < picture.data.length; i++) {
            base64String += String.fromCharCode(picture.data[i]);
          }
          const base64 = "data:" + picture.format + ";base64," + window.btoa(base64String);
          
          coverImage = new Image();
          coverImage.onload = () => {
            preview.src = base64;
            preview.style.display = "block";
            status.innerText = "Carátula detectada. Listo para convertir a MP4.";
            convertBtn.style.display = "block";
          };
          coverImage.src = base64;
        } else {
          status.innerText = "Sin carátula integrada. Se creará MP4 con fondo oscuro.";
          convertBtn.style.display = "block";
        }
      },
      onError: function() {
        status.innerText = "Archivo cargado correctamente.";
        convertBtn.style.display = "block";
      }
    });
  });

  function renderImageToCanvas() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    if (coverImage) {
      ctx.save();
      ctx.filter = "blur(50px) brightness(0.5)";
      const bgScale = Math.max(canvas.width / coverImage.width, canvas.height / coverImage.height);
      const bgW = coverImage.width * bgScale;
      const bgH = coverImage.height * bgScale;
      ctx.drawImage(coverImage, (canvas.width - bgW) / 2, (canvas.height - bgH) / 2, bgW, bgH);
      ctx.restore();

      const scale = Math.min(canvas.width / coverImage.width, canvas.height / coverImage.height);
      const w = coverImage.width * scale;
      const h = coverImage.height * scale;
      const x = (canvas.width - w) / 2;
      const y = (canvas.height - h) / 2;

      ctx.save();
      ctx.shadowColor = "rgba(0, 0, 0, 0.8)";
      ctx.shadowBlur = 40;
      ctx.drawImage(coverImage, x, y, w, h);
      ctx.restore();
    } else {
      ctx.fillStyle = "#0f172a";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "#ffffff";
      ctx.font = "bold 48px sans-serif";
      ctx.textAlign = "center";
      ctx.fillText(selectedFile ? selectedFile.name : "Audio MP3", canvas.width / 2, canvas.height / 2);
    }
  }

  convertBtn.addEventListener('click', async () => {
    if (!selectedFile) return;

    convertBtn.disabled = true;
    progressContainer.style.display = "block";
    progressBar.style.width = "0%";
    progressText.innerText = "0%";
    status.innerText = "Generando estructura del contenedor MP4...";

    renderImageToCanvas();

    // Exportar el canvas como una imagen JPEG estática para FFmpeg
    const canvasDataUrl = canvas.toDataURL('image/jpeg', 0.95);
    const imageBlob = await (await fetch(canvasDataUrl)).blob();

    // Cargar archivos al sistema de archivos virtual de FFmpeg
    ffmpeg.FS('writeFile', 'image.jpg', await fetchFile(imageBlob));
    ffmpeg.FS('writeFile', 'audio.mp3', await fetchFile(selectedFile));

    ffmpeg.setProgress(({ ratio }) => {
      const percent = Math.min(Math.max(Math.round(ratio * 100), 0), 100);
      progressBar.style.width = `${percent}%`;
      progressText.innerText = `${percent}%`;
    });

    status.innerText = "Codificando archivo MP4 (H.264/AAC)...";

    // Comando nativo de FFmpeg para ensamblar MP4 sin re-codificar innecesariamente el audio
    await ffmpeg.run(
      '-loop', '1',
      '-i', 'image.jpg',
      '-i', 'audio.mp3',
      '-c:v', 'libx264',
      '-tune', 'stillimage',
      '-c:a', 'aac',
      '-b:a', '192k',
      '-pix_fmt', 'yuv420p',
      '-shortest',
      'output.mp4'
    );

    const data = ffmpeg.FS('readFile', 'output.mp4');
    const mp4Url = URL.createObjectURL(new Blob([data.buffer], { type: 'video/mp4' }));

    downloadLink.href = mp4Url;
    downloadLink.download = selectedFile.name.replace(/\.[^/.]+$/, "") + ".mp4";
    downloadLink.innerText = "Descargar Archivo (.mp4)";
    downloadLink.style.display = "block";
    
    status.innerText = "¡Conversión finalizada! Archivo .mp4 listo.";
    convertBtn.disabled = false;
    progressBar.style.width = "100%";
    progressText.innerText = "100%";
  });
</script>

</body>
</html>
