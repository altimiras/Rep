<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Formulario Playlist</title>
<style>
:root{--bg:#eef1f5;--panel:#fff;--ink:#1b2433;--mute:#5d6878;--line:#cfd6e0;--acc:#1f6f8b;--acc-ink:#fff;--bad:#b3362b;--ok:#2e7d4f}
@media (prefers-color-scheme:dark){:root{--bg:#141a24;--panel:#1d2532;--ink:#e8edf4;--mute:#9aa6b8;--line:#334055;--acc:#4aa3c4;--acc-ink:#0d1620;--bad:#ff8a7d;--ok:#6fcf97}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:12px 12px 40px}
main{max-width:640px;margin:0 auto}
h1{font-size:1.35rem;margin:4px 0 2px}
h2{font-size:1.05rem;margin:0 0 10px}
.sub{color:var(--mute);margin:0 0 14px;font-size:.92rem}
section{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:14px}
label{display:block;font-weight:600;font-size:.9rem;margin:10px 0 4px}
label small{font-weight:400;color:var(--mute)}
input,textarea,button{font:inherit;color:inherit}
input[type=text],input[type=url],textarea,select{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
textarea{min-height:130px;resize:vertical}
select{font:inherit;color:inherit}
input:focus,textarea:focus,select:focus,button:focus-visible,summary:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
button{padding:11px 14px;border-radius:8px;border:1px solid var(--line);background:var(--panel);min-height:44px;cursor:pointer}
button.main{background:var(--acc);color:var(--acc-ink);border-color:var(--acc);font-weight:600}
button.del{color:var(--bad)}
button.mini{padding:6px 10px;min-height:38px}
.inline{display:flex;gap:8px}
.inline input{flex:1}
.msg{margin:10px 0 0;font-size:.92rem;min-height:1.3em}
.msg.err{color:var(--bad)}.msg.ok{color:var(--ok)}
ul{list-style:none;margin:0;padding:0}
li{border-top:1px solid var(--line);padding:10px 0}
li:first-child{border-top:0}
li.edit{background:color-mix(in srgb,var(--acc) 12%,transparent);margin:0 -8px;padding:10px 8px;border-radius:8px}
.t{font-weight:600}
.m{color:var(--mute);font-size:.88rem;word-break:break-all}
.empty{color:var(--mute)}
pre{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;overflow-x:auto;font-size:.8rem;max-height:320px;white-space:pre-wrap;word-break:break-word}
details summary{cursor:pointer;font-weight:600;padding:6px 0}
#diag{font:.78rem/1.4 ui-monospace,Menlo,monospace;max-height:220px;overflow:auto;white-space:pre-wrap;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px}
</style>
</head>
<body>
<main>
<h1>Formulario de playlist</h1>
<p class="sub">Agrega canciones una por una y descarga el archivo <b>playlist.json</b>.</p>

<section>
  <h2>Biblioteca en GitHub</h2>
  <div class="row" style="margin-top:0"><button type="button" id="btnScan" class="main">Leer carpetas</button></div>
  <p class="msg" id="msg0" role="status"></p>
  <label for="selRitmo">Ritmo</label>
  <select id="selRitmo" disabled></select>
  <label for="selCancion">Canción <small>(✓ ya está en la lista)</small></label>
  <select id="selCancion" disabled></select>
  <div class="row">
    <button type="button" id="btnBulk">Agregar pendientes de este ritmo</button>
    <button type="button" id="btnBulkAll">Agregar todas las pendientes</button>
    <button type="button" id="btnStop" class="del" hidden>Detener</button>
  </div>
</section>

<section>
  <h2 id="tituloForm">Nueva canción</h2>
  <label for="titulo">Título</label>
  <input type="text" id="titulo" autocomplete="off" placeholder="Agua salada">
  <label for="ritmo">Ritmo</label>
  <input type="text" id="ritmo" list="ritmos" autocomplete="off" placeholder="Baladas">
  <datalist id="ritmos"></datalist>
  <label for="archivo">Archivo <small>(enlace al mp3)</small></label>
  <input type="url" id="archivo" autocomplete="off" placeholder="https://raw.githubusercontent.com/...">
  <div class="row" style="margin-top:6px"><button type="button" id="btnGen" class="mini">Generar enlace con ritmo y título</button></div>
  <label for="caratula">Carátula <small>(opcional, ruta de la imagen)</small></label>
  <input type="text" id="caratula" autocomplete="off" placeholder="imagenes/agua-salada.jpg">
  <label for="letra">Letra <small>(opcional)</small></label>
  <textarea id="letra" placeholder="Aquí va la letra de la canción"></textarea>
  <div class="row">
    <button type="button" id="btnAdd" class="main">Agregar canción</button>
    <button type="button" id="btnCancel" hidden>Cancelar edición</button>
  </div>
  <p class="msg" id="msg" role="status"></p>
</section>

<section>
  <h2>Canciones (<span id="count">0</span>)</h2>
  <ul id="lista"></ul>
  <div class="row">
    <button type="button" id="btnDown" class="main">Descargar playlist.json</button>
    <button type="button" id="btnCopy">Copiar JSON</button>
  </div>
  <p class="msg" id="msg2" role="status"></p>
</section>

<section>
  <h2>Opciones</h2>
  <label for="version">Versión del archivo</label>
  <input type="text" id="version" value="1.2" autocomplete="off">
  <label for="repo">Repositorio <small>(usuario/nombre)</small></label>
  <input type="text" id="repo" value="altimiras/Z" autocomplete="off">
  <label for="rama">Rama</label>
  <input type="text" id="rama" value="main" autocomplete="off">
  <label for="ruta">Carpeta de los mp3</label>
  <input type="text" id="ruta" value="Mp3" autocomplete="off">
  <label for="carp">Carpeta de carátulas <small>(en el mismo repositorio)</small></label>
  <input type="text" id="carp" value="imagenes" autocomplete="off">
  <label for="selCar">Carátula guardada como</label>
  <select id="selCar"><option value="rel">Ruta relativa (imagenes/archivo.jpg)</option><option value="url">Enlace completo</option></select>
  <label for="file">Continuar desde un playlist.json existente</label>
  <input type="file" id="file" accept=".json,application/json">
  <div class="row"><button type="button" id="btnClear" class="del">Vaciar lista</button></div>
  <details style="margin-top:10px"><summary>Vista previa del JSON</summary><pre id="prev"></pre></details>
  <details><summary>Diagnóstico</summary><div id="diag"></div></details>
</section>
</main>

<script>
(function(){
"use strict";
var $=function(i){return document.getElementById(i)};
var KEY="playlist_form_v1", BASE0="https://raw.githubusercontent.com/altimiras/Z/main/Mp3/";
var songs=[], editIdx=-1;

function log(t){
  var d=$("diag"), h=new Date().toTimeString().slice(0,8);
  d.textContent+= "["+h+"] "+t+"\n"; d.scrollTop=d.scrollHeight;
}
window.addEventListener("error",function(e){log("ERROR: "+e.message+" (línea "+e.lineno+")")});
window.addEventListener("unhandledrejection",function(e){log("PROMESA: "+(e.reason&&e.reason.message||e.reason))});

function say(id,t,cls){var m=$(id);m.textContent=t;m.className="msg "+(cls||"")}

function save(){
  try{localStorage.setItem(KEY,JSON.stringify({songs:songs,version:$("version").value,cfg:cfg()}))}
  catch(e){log("Sin guardado automático: "+e.message)}
}
function load(){
  try{
    var r=localStorage.getItem(KEY); if(!r){return}
    var o=JSON.parse(r); songs=Array.isArray(o.songs)?o.songs:[];
    if(o.version)$("version").value=o.version;
    if(o.cfg)["repo","rama","ruta","carp","selCar"].forEach(function(k){if(o.cfg[k])$(k).value=o.cfg[k]});
    log("Recuperadas "+songs.length+" canciones del guardado automático.");
  }catch(e){log("No se pudo leer el guardado: "+e.message)}
}

function build(){
  return {version:$("version").value.trim()||"1.2",canciones:songs};
}
function json(){return JSON.stringify(build(),null,2)}

function render(){
  var ul=$("lista"); ul.innerHTML="";
  $("count").textContent=songs.length;
  if(!songs.length){var e=document.createElement("li");e.className="empty";e.textContent="Todavía no hay canciones. Completa el formulario y toca Agregar canción.";ul.appendChild(e)}
  songs.forEach(function(s,i){
    var li=document.createElement("li"); if(i===editIdx)li.className="edit";
    var t=document.createElement("div");t.className="t";t.textContent=s.titulo;
    var m=document.createElement("div");m.className="m";
    m.textContent=s.ritmo+(s.caratula?" · con carátula":"")+(s.letra?" · con letra":"");
    li.appendChild(t);li.appendChild(m);
    var r=document.createElement("div");r.className="row";r.style.marginTop="8px";
    [["Editar",function(){startEdit(i)},""],["▲",function(){move(i,-1)},""],["▼",function(){move(i,1)},""],["Borrar",function(){del(i)},"del"]].forEach(function(b){
      var x=document.createElement("button");x.type="button";x.textContent=b[0];x.className="mini "+b[2];
      if(b[0]==="▲")x.setAttribute("aria-label","Subir");if(b[0]==="▼")x.setAttribute("aria-label","Bajar");
      x.onclick=b[1];r.appendChild(x)});
    li.appendChild(r);ul.appendChild(li);
  });
  var dl=$("ritmos"); dl.innerHTML="";
  var seen={}; songs.concat(lib.map(function(g){return {ritmo:g.r}})).forEach(function(s){if(s.ritmo&&!seen[s.ritmo]){seen[s.ritmo]=1;var o=document.createElement("option");o.value=s.ritmo;dl.appendChild(o)}});
  $("prev").textContent=json();
  fillCanciones();
  save();
}

function readForm(){
  var c=$("caratula").value.trim();
  return {titulo:$("titulo").value.trim(),ritmo:$("ritmo").value.trim(),archivo:$("archivo").value.trim(),caratula:c?c:null,letra:$("letra").value.replace(/\r\n/g,"\n")};
}
function clearForm(keepRitmo){
  var r=$("ritmo").value;
  ["titulo","archivo","caratula","letra"].forEach(function(k){$(k).value=""});
  if(!keepRitmo)$("ritmo").value=""; else $("ritmo").value=r;
}
function startEdit(i){
  var s=songs[i]; editIdx=i;
  $("titulo").value=s.titulo||"";$("ritmo").value=s.ritmo||"";$("archivo").value=s.archivo||"";
  $("caratula").value=s.caratula||"";$("letra").value=s.letra||"";
  $("tituloForm").textContent="Editando canción";$("btnAdd").textContent="Guardar cambios";$("btnCancel").hidden=false;
  say("msg","");render();window.scrollTo({top:0,behavior:"smooth"});log("Editando: "+s.titulo);
}
function endEdit(){
  editIdx=-1;$("tituloForm").textContent="Nueva canción";$("btnAdd").textContent="Agregar canción";$("btnCancel").hidden=true;
}
function move(i,d){
  var j=i+d; if(j<0||j>=songs.length)return;
  var t=songs[i];songs[i]=songs[j];songs[j]=t;
  if(editIdx===i)editIdx=j;else if(editIdx===j)editIdx=i;
  render();
}
function del(i){
  if(!confirm("¿Borrar «"+songs[i].titulo+"»?"))return;
  log("Borrada: "+songs[i].titulo);songs.splice(i,1);
  if(editIdx===i){endEdit();clearForm()}else if(editIdx>i)editIdx--;
  render();
}

$("btnAdd").onclick=function(){
  var s=readForm(), falta=[];
  if(!s.titulo)falta.push("título");if(!s.ritmo)falta.push("ritmo");if(!s.archivo)falta.push("archivo");
  if(falta.length){say("msg","Falta completar: "+falta.join(", ")+".","err");return}
  var warn="";
  if(!/^https?:\/\//i.test(s.archivo))warn=" Aviso: el archivo no empieza con http(s).";
  if(editIdx>=0){songs[editIdx]=s;log("Actualizada: "+s.titulo);endEdit();clearForm();say("msg","Cambios guardados."+warn,warn?"err":"ok")}
  else{songs.push(s);log("Agregada: "+s.titulo);clearForm(true);say("msg","Canción agregada."+warn,warn?"err":"ok")}
  render();
};
$("btnCancel").onclick=function(){endEdit();clearForm();say("msg","");render()};

$("btnGen").onclick=function(){
  var r=$("ritmo").value.trim(),t=$("titulo").value.trim();
  if(!r||!t){say("msg","Completa título y ritmo para generar el enlace.","err");return}
  var b=baseUrl();
  $("archivo").value=b+encodeURIComponent(r)+"/"+encodeURIComponent(t)+".mp3";
  say("msg","Enlace generado. Revísalo antes de agregar.","ok");
};

$("btnDown").onclick=function(){
  if(!songs.length){say("msg2","Agrega al menos una canción.","err");return}
  try{
    var blob=new Blob([json()],{type:"application/json"});
    var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="playlist.json";
    document.body.appendChild(a);a.click();
    setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},1500);
    say("msg2","Archivo playlist.json generado ("+songs.length+" canciones).","ok");log("Descarga: "+blob.size+" bytes");
  }catch(e){say("msg2","No se pudo descargar: "+e.message,"err");log("Descarga falló: "+e.message)}
};
$("btnCopy").onclick=function(){
  var txt=json();
  function fb(){
    var ta=document.createElement("textarea");ta.value=txt;document.body.appendChild(ta);ta.select();
    try{document.execCommand("copy");say("msg2","JSON copiado.","ok")}catch(e){say("msg2","No se pudo copiar.","err")}
    ta.remove();
  }
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(function(){say("msg2","JSON copiado.","ok")},fb)}else fb();
};

$("file").onchange=function(ev){
  var f=ev.target.files[0]; if(!f)return;
  var rd=new FileReader();
  rd.onload=function(){
    try{
      var o=JSON.parse(rd.result);
      if(!o||!Array.isArray(o.canciones))throw new Error("no contiene la lista «canciones»");
      if(songs.length&&!confirm("Esto reemplaza las "+songs.length+" canciones actuales. ¿Continuar?"))return;
      songs=o.canciones.map(function(c){return {titulo:c.titulo||"",ritmo:c.ritmo||"",archivo:c.archivo||"",caratula:c.caratula||null,letra:c.letra||""}});
      if(o.version)$("version").value=o.version;
      endEdit();clearForm();render();say("msg2","Cargadas "+songs.length+" canciones.","ok");log("Cargado "+f.name+": "+songs.length+" canciones");
    }catch(e){say("msg2","Archivo no válido: "+e.message,"err");log("Carga falló: "+e.message)}
  };
  rd.onerror=function(){say("msg2","No se pudo leer el archivo.","err")};
  rd.readAsText(f);ev.target.value="";
};
$("btnClear").onclick=function(){
  if(!songs.length||!confirm("¿Vaciar toda la lista?"))return;
  songs=[];endEdit();clearForm();render();say("msg2","Lista vacía.","ok");log("Lista vaciada");
};
$("version").oninput=function(){save();$("prev").textContent=json()};

var lib=[],CK="playlist_lib_v1",stop=false,tk=0;
function cfg(){return {repo:$("repo").value.trim(),rama:$("rama").value.trim(),ruta:$("ruta").value.trim().replace(/^\/|\/$/g,""),carp:$("carp").value.trim().replace(/^\/|\/$/g,""),selCar:$("selCar").value}}
function baseUrl(){var c=cfg();return "https://raw.githubusercontent.com/"+c.repo+"/"+c.rama+"/"+c.ruta+"/"}
function urlOf(r,n){return baseUrl()+encodeURIComponent(r)+"/"+encodeURIComponent(n)}
function nom(n){return n.replace(/\.[^.]+$/,"")}
function caratulaOf(g,f){
  if(!f.jpg)return null;
  var c=cfg();
  return c.selCar==="rel"?c.carp+"/"+f.jpg:"https://raw.githubusercontent.com/"+c.repo+"/"+c.rama+"/"+c.carp+"/"+encodeURIComponent(f.jpg);
}
function have(g,f){var u=urlOf(g.r,f.n);return songs.some(function(s){return s.archivo===u})}
function buildLib(paths){
  var ruta=cfg().ruta+"/",map={},jp={};
  paths.forEach(function(p){
    if(p.indexOf(ruta)!==0)return;
    var a=p.slice(ruta.length).split("/");if(a.length!==2)return;
    if(/\.mp3$/i.test(a[1]))(map[a[0]]=map[a[0]]||[]).push(a[1]);
  });
  var cr=cfg().carp+"/";
  paths.forEach(function(p){
    if(p.indexOf(cr)!==0)return;var n=p.slice(cr.length);
    if(n.indexOf("/")<0&&/\.jpe?g$/i.test(n))jp[nom(n).toLowerCase()]=n;
  });
  var cmp=function(x,y){return x.localeCompare(y,"es")};
  return Object.keys(map).sort(cmp).map(function(g){
    return {r:g,f:map[g].sort(cmp).map(function(n){return {n:n,jpg:jp[nom(n).toLowerCase()]||null}})};
  });
}
function opt(v,t){var o=document.createElement("option");o.value=v;o.textContent=t;return o}
function fillRitmos(){
  var s=$("selRitmo");s.innerHTML="";s.appendChild(opt("","Elige un ritmo"));
  lib.forEach(function(g,i){s.appendChild(opt(i,g.r+" ("+g.f.length+")"))});
  s.disabled=!lib.length;fillCanciones();
}
function fillCanciones(){
  var s=$("selCancion"),g=lib[$("selRitmo").value];
  s.innerHTML="";s.appendChild(opt("","Elige una canción"));
  if(g)g.f.forEach(function(f,i){s.appendChild(opt(i,(have(g,f)?"✓ ":"")+nom(f.n)))});
  s.disabled=!g;
}
function restoreLib(){
  try{var c=localStorage.getItem(CK);if(c){lib=JSON.parse(c);fillRitmos();say("msg0","Última lectura guardada: "+lib.length+" ritmos. Toca Leer carpetas para actualizar.")}}catch(e){log("Sin biblioteca guardada: "+e.message)}
}
$("btnScan").onclick=function(){
  var c=cfg();say("msg0","Leyendo carpetas…");
  fetch("https://api.github.com/repos/"+c.repo+"/git/trees/"+encodeURIComponent(c.rama)+"?recursive=1").then(function(r){
    if(!r.ok)throw new Error("GitHub respondió "+r.status+(r.status===403?" (límite de consultas, espera unos minutos)":""));
    return r.json();
  }).then(function(d){
    if(d.truncated)log("Aviso: GitHub devolvió una lista incompleta.");
    lib=buildLib(d.tree.filter(function(t){return t.type==="blob"}).map(function(t){return t.path}));
    try{localStorage.setItem(CK,JSON.stringify(lib))}catch(e){}
    fillRitmos();render();
    var n=lib.reduce(function(a,g){return a+g.f.length},0);
    var nc=lib.reduce(function(a,g){return a+g.f.filter(function(f){return f.jpg}).length},0);
    say("msg0",lib.length+" ritmos y "+n+" canciones encontradas. Carátulas halladas en «"+cfg().carp+"»: "+nc+".","ok");log("Biblioteca: "+lib.length+" carpetas, "+n+" mp3");
  }).catch(function(e){
    say("msg0",lib.length?"Sin conexión con GitHub. Se usa la última lectura guardada.":"No se pudo leer: "+e.message,"err");
    log("Lectura falló: "+e.message);
  });
};
$("selRitmo").onchange=fillCanciones;
$("selCancion").onchange=function(){
  var g=lib[$("selRitmo").value],f=g&&g.f[$("selCancion").value];if(!f)return;
  if(editIdx>=0)endEdit();
  var u=urlOf(g.r,f.n),t=++tk;
  $("titulo").value=nom(f.n);$("ritmo").value=g.r;$("archivo").value=u;
  $("caratula").value=caratulaOf(g,f)||"";$("letra").value="";
  say("msg","Datos cargados. Leyendo la letra del mp3…");
  readLetra(u).then(function(l){
    if(t!==tk)return;$("letra").value=l;
    say("msg",l?"Datos y letra cargados. Revisa y toca Agregar canción.":"Datos cargados. Este mp3 no trae letra.","ok");
    log("Letra de "+f.n+": "+l.length+" caracteres");
  }).catch(function(e){
    if(t!==tk)return;say("msg","Datos cargados, pero no se pudo leer la letra: "+e.message,"err");log("Letra falló ("+f.n+"): "+e.message);
  });
};
function getBuf(u,end){
  return fetch(u,{headers:{Range:"bytes=0-"+end}}).then(function(r){if(!r.ok)throw new Error("HTTP "+r.status);return r.arrayBuffer()})
  .catch(function(){return fetch(u).then(function(r){if(!r.ok)throw new Error("HTTP "+r.status);return r.arrayBuffer()})});
}
function ss(d,i){return ((d[i]&127)<<21)|((d[i+1]&127)<<14)|((d[i+2]&127)<<7)|(d[i+3]&127)}
function u32(d,i){return d[i]*16777216+(d[i+1]<<16)+(d[i+2]<<8)+d[i+3]}
function readLetra(u){
  return getBuf(u,9).then(function(b){
    var h=new Uint8Array(b);
    if(h.length<10||h[0]!==73||h[1]!==68||h[2]!==51)return "";
    return getBuf(u,ss(h,6)+9).then(parseTag);
  });
}
function parseTag(buf){
  var d=new Uint8Array(buf),v=d[3];if(v<3)return "";
  var end=Math.min(ss(d,6)+10,d.length),p=10;
  if(d[5]&64)p+=v===4?ss(d,10):u32(d,10)+4;
  while(p+10<=end){
    var id=String.fromCharCode(d[p],d[p+1],d[p+2],d[p+3]);
    if(!/^[A-Z0-9]{4}$/.test(id))break;
    var fs=v===4?ss(d,p+4):u32(d,p+4),body=d.subarray(p+10,p+10+fs);p+=10+fs;
    if(id==="USLT"&&body.length>4)return decUslt(body);
  }
  return "";
}
function decUslt(b){
  var e=b[0],i=4,two=e===1||e===2;
  if(two){while(i+1<b.length&&!(b[i]===0&&b[i+1]===0))i+=2;i+=2}
  else{while(i<b.length&&b[i]!==0)i++;i++}
  var t=b.subarray(i),lab=e===0?"windows-1252":e===1?"utf-16le":e===2?"utf-16be":"utf-8";
  if(e===1&&t[0]===254&&t[1]===255)lab="utf-16be";
  return new TextDecoder(lab).decode(t).replace(/\u0000+$/,"").replace(/\r\n?/g,"\n").trim();
}
function bulk(all){
  var gi=$("selRitmo").value,jobs=[];
  if(!all&&gi===""){say("msg0","Elige un ritmo primero.","err");return}
  lib.forEach(function(g,i){
    if(!all&&String(i)!==gi)return;
    g.f.forEach(function(f){if(!have(g,f))jobs.push([g,f])});
  });
  if(!jobs.length){say("msg0","No hay canciones pendientes.","ok");return}
  if(!confirm("Se agregarán "+jobs.length+" canciones y se leerá la letra de cada mp3. ¿Continuar?"))return;
  stop=false;$("btnStop").hidden=false;
  var k=0,fail=0;
  function fin(){
    $("btnStop").hidden=true;render();
    say("msg0",(stop?"Detenido. ":"Listo. ")+k+" canciones agregadas"+(fail?" ("+fail+" sin letra por error de lectura)":"")+".","ok");
    log("Lote terminado: "+k+" agregadas, "+fail+" errores de letra");
  }
  (function next(){
    if(stop||k>=jobs.length){fin();return}
    var g=jobs[k][0],f=jobs[k][1];k++;
    say("msg0","Procesando "+k+" de "+jobs.length+": "+nom(f.n));
    var u=urlOf(g.r,f.n);
    readLetra(u).catch(function(e){fail++;log("Letra falló ("+f.n+"): "+e.message);return ""}).then(function(l){
      songs.push({titulo:nom(f.n),ritmo:g.r,archivo:u,caratula:caratulaOf(g,f),letra:l});
      if(k%10===0)render();
      next();
    });
  })();
}
$("btnBulk").onclick=function(){bulk(false)};
$("btnBulkAll").onclick=function(){bulk(true)};
$("btnStop").onclick=function(){stop=true;say("msg0","Deteniendo…")};
["repo","rama","ruta","carp","selCar"].forEach(function(k){$(k).onchange=save});

load();restoreLib();
render();log("Listo. Chrome: "+(navigator.userAgent.match(/Chrome\/[\d.]+/)||["?"])[0]);
})();
