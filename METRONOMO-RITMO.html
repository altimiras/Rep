<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maestra V4 - Bases Conocidas + Metronomo</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0a0a12;color:#e6e6f0;font-family:Inter,system-ui,sans-serif;line-height:1.6}
.header{padding:28px 20px;text-align:center;background:linear-gradient(135deg,#1a1033,#101a33);border-bottom:2px solid #2a2a4a}
.header h1{font-size:22px;color:#a78bfa}
.header p{opacity:0.7;font-size:13px;margin-top:6px}
.container{max-width:900px;margin:0 auto;padding:16px;display:flex;flex-direction:column;gap:24px}
.cat-bar{display:flex;flex-wrap:wrap;gap:8px}
.cat-btn{padding:10px 16px;border-radius:20px;border:1px solid #3a3a5a;background:#16162a;color:#ccc;cursor:pointer;min-height:44px}
.cat-btn.active{background:#8b5cf6;color:white;border-color:#8b5cf6}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:600px){.grid{grid-template-columns:1fr}}
.card{padding:14px;border-radius:14px;background:#16162a;border:1px solid #2a2a4a;cursor:pointer;min-height:72px}
.card.sel{border-color:#8b5cf6;background:#1e1b3a}
.card h4{font-size:14px;color:#fff}
.card span{font-size:12px;opacity:0.6}
.detail{display:flex;flex-direction:column;gap:20px;background:#121228;border:1px solid #2a2a5a;border-radius:18px;padding:20px}
.badge{display:inline-block;padding:4px 10px;border-radius:12px;background:#1e1e3a;font-size:12px;border:1px solid #333}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:8px 12px;border-radius:16px;background:#1e1e3a;border:1px solid #3a3a5a;color:#bbb;cursor:pointer;min-height:40px;font-size:13px}
.chip.on{background:#8b5cf6;color:#fff}
.base-box{background:#1a1a33;border:1px solid #3a3a6a;border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px}
.base-box h3{font-size:15px;color:#c4b5fd}
.lyric{font-style:italic;background:#101025;padding:12px;border-radius:10px;border-left:3px solid #8b5cf6;white-space:pre-wrap;font-size:14px}
.btn{padding:10px 16px;border-radius:12px;border:none;cursor:pointer;min-height:44px;font-weight:600}
.btn-primary{background:#8b5cf6;color:white}
.btn-ghost{background:#222240;color:#ccc;border:1px solid #3a3a5a}
.metronome{background:#0e0e22;border:1px solid #2a2a5a;border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:14px}
.beats{display:flex;flex-wrap:wrap;gap:8px}
.beat{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;transition:all 0.1s;background:#1a1a2a;border:2px solid #333;color:#666}
.beat.strong.active{background:#ef4444;color:white;transform:scale(1.3);border-color:#ef4444;box-shadow:0 0 12px #ef4444}
.beat.medium.active{background:#f59e0b;color:white;transform:scale(1.2)}
.beat.weak.active{background:#22d3ee;color:#000;transform:scale(1.15)}
.syllables{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.syl{padding:6px 10px;border-radius:8px;background:#1a1a2a;border:1px solid #2a2a4a;font-size:14px;transition:all 0.15s}
.syl.cur{background:#fde047;color:#000;transform:scale(1.1);font-weight:700}
.syl.cur.strong{background:#ef4444;color:white;transform:scale(1.25)}
.textarea{width:100%;min-height:140px;background:#0a0a1a;border:1px solid #2a2a5a;border-radius:12px;padding:12px;color:#e6e6f0;font-size:15px;resize:vertical;line-height:1.6}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
input[type=range]{flex:1;min-width:120px}
.small{font-size:12px;opacity:0.6}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useRef} = React;
const RITMOS = [
 {id:'rock-clasico',cat:'ROCK',nombre:'Rock Clásico',compas:'4/4',bpm:120,patron:[{a:'strong'},{a:'weak'},{a:'medium'},{a:'weak'}],ej:{titulo:'Come Together',artista:'The Beatles',anio:1969,letra:'Here come old flat-top\nHe come groovin\' up slowly',nota:'8-9 sílabas, acento 1 y 3, backbeat caja en 2 y 4.'}},
 {id:'rock-prog-78',cat:'ROCK',nombre:'Rock Progresivo 7/8',compas:'7/8 (3+2+2)',bpm:140,patron:[{a:'strong'},{a:'weak'},{a:'weak'},{a:'medium'},{a:'weak'},{a:'medium'},{a:'weak'}],ej:{titulo:'Money',artista:'Pink Floyd',anio:1973,letra:'Money, get away\nGet a good job with more pay',nota:'7 tiempos, acentos en 1,4,6. Fraseo irregular sinfónico.'}},
 {id:'hard-rock',cat:'ROCK',nombre:'Hard Rock',compas:'4/4',bpm:128,patron:[{a:'strong'},{a:'weak'},{a:'medium'},{a:'weak'}],ej:{titulo:'Back in Black',artista:'AC/DC',anio:1980,letra:'Back in black\nI hit the sack',nota:'8 sílabas contundentes, power chord en 1.'}},
 {id:'punk',cat:'ROCK',nombre:'Punk',compas:'4/4 rápido',bpm:190,patron:[{a:'strong'},{a:'weak'},{a:'weak'},{a:'weak'},{a:'strong'},{a:'weak'},{a:'weak'},{a:'weak'}],ej:{titulo:'Blitzkrieg Bop',artista:'Ramones',anio:1976,letra:'Hey ho, let\'s go\nHey ho, let\'s go',nota:'6 sílabas ultra directo.'}},
 {id:'grunge',cat:'ROCK',nombre:'Grunge',compas:'4/4',bpm:112,patron:[{a:'strong'},{a:'weak'},{a:'medium'},{a:'weak'}],ej:{titulo:'Smells Like Teen Spirit',artista:'Nirvana',anio:1991,letra:'Load up on guns\nBring your friends',nota:'Fraseo arrastrado, acento en 1.'}},
 {id:'power-ballad',cat:'ROCK',nombre:'Power Ballad 6/8',compas:'6/8',bpm:72,patron:[{a:'strong'},{a:'weak'},{a:'weak'},{a:'medium'},{a:'weak'},{a:'weak'}],ej:{titulo:'Bohemian Rhapsody',artista:'Queen',anio:1975,letra:'Mama, just killed a man\nPut a gun against his head',nota:'6/8 emotivo, dos acentos 1 y 4.'}},
 {id:'tango',cat:'RIO DE LA PLATA',nombre:'Tango',compas:'4/4',bpm:120,patron:[{a:'strong'},{a:'weak'},{a:'medium'},{a:'weak'}],ej:{titulo:'Por una cabeza',artista:'Carlos Gardel',anio:1935,letra:'Por una cabeza\nDe un noble potrillo',nota:'8 sílabas, marcato en 1 y 3.'}},
 {id:'vals-criollo',cat:'RIO DE LA PLATA',nombre:'Vals Criollo',compas:'3/4',bpm:90,patron:[{a:'strong'},{a:'weak'},{a:'weak'}],ej:{titulo:'Desde el alma',artista:'Vals clásico',anio:1911,letra:'Alma, si tanto te han herido',nota:'Vals 3 tiempos, solo 1 fuerte.'}},
 {id:'candombe',cat:'RIO DE LA PLATA',nombre:'Candombe',compas:'4/4',bpm:100,patron:[{a:'strong'},{a:'weak'},{a:'medium'},{a:'weak'}],ej:{titulo:'Candombe del 31',artista:'Jaime Roos',anio:1985,letra:'Mama vieja y tamboril\nCandombe del 31',nota:'Clave afro 3-2.'}},
 {id:'bolero',cat:'TROPICAL',nombre:'Bolero',compas:'4/4',bpm:85,patron:[{a:'strong'},{a:'weak'},{a:'weak'},{a:'weak'}],ej:{titulo:'Bésame Mucho',artista:'Consuelo Velázquez',anio:1940,letra:'Bésame, bésame mucho\nComo si fuera esta noche',nota:'8-10 sílabas románticas.'}},
 {id:'salsa',cat:'TROPICAL',nombre:'Salsa Clave 3-2',compas:'4/4 clave 16',bpm:95,patron:Array.from({length:16},(_,i)=>({a:[0,3,6,9,12].includes(i)?'strong':'weak'})),ej:{titulo:'Oye Como Va',artista:'Tito Puente',anio:1962,letra:'Oye como va\nMi ritmo',nota:'Clave 3-2, tumbao.'}},
 {id:'bossa',cat:'TROPICAL',nombre:'Bossa Nova',compas:'4/4',bpm:120,patron:[{a:'strong'},{a:'weak'},{a:'medium'},{a:'weak'}],ej:{titulo:'Garota de Ipanema',artista:'Jobim',anio:1962,letra:'Olha que coisa mais linda\nMais cheia de graça',nota:'Síncopa suave.'}},
 {id:'reggaeton',cat:'TROPICAL',nombre:'Reggaeton Dembow',compas:'4/4',bpm:95,patron:[{a:'strong'},{a:'weak'},{a:'weak'},{a:'medium'},{a:'weak'},{a:'weak'},{a:'strong'},{a:'weak'}],ej:{titulo:'Gasolina',artista:'Daddy Yankee',anio:2004,letra:'A ella le gusta la gasolina\nDame más gasolina',nota:'Dembow kick 1, snare 3.'}},
 {id:'reggae',cat:'TROPICAL',nombre:'Reggae',compas:'4/4',bpm:80,patron:[{a:'weak'},{a:'weak'},{a:'strong'},{a:'weak'}],ej:{titulo:'Is This Love',artista:'Bob Marley',anio:1978,letra:'I wanna love you\nAnd treat you right',nota:'Acento en 3, offbeat.'}},
 {id:'hiphop',cat:'URBANO',nombre:'Hip Hop',compas:'4/4',bpm:90,patron:[{a:'strong'},{a:'weak'},{a:'medium'},{a:'weak'}],ej:{titulo:'Lose Yourself',artista:'Eminem',anio:2002,letra:'His palms are sweaty\nKnees weak, arms are heavy',nota:'Flow 16s, bombo 1 caja 3.'}},
 {id:'trap',cat:'URBANO',nombre:'Trap',compas:'4/4 triplets',bpm:140,patron:[{a:'strong'},{a:'weak'},{a:'weak'},{a:'weak'},{a:'weak'},{a:'weak'}],ej:{titulo:'Tití Me Preguntó',artista:'Bad Bunny',anio:2022,letra:'Tití me preguntó\nSi tengo muchas novias',nota:'Hi-hat triplets, 808 en 1.'}},
 {id:'cueca',cat:'FOLKLORE',nombre:'Cueca Chilena 52',compas:'6/8-3/4',bpm:120,patron:[{a:'strong'},{a:'weak'},{a:'weak'},{a:'medium'},{a:'weak'},{a:'weak'}],ej:{titulo:'La Consentida',artista:'Jaime Atria',anio:1960,letra:'Si vas para Chile\nTe ruego que pases',nota:'7-5-7-5 seguidilla, pandero + zapateo.'}},
 {id:'zamba',cat:'FOLKLORE',nombre:'Zamba',compas:'6/8',bpm:80,patron:[{a:'strong'},{a:'weak'},{a:'weak'},{a:'medium'},{a:'weak'},{a:'weak'}],ej:{titulo:'Alfonsina y el mar',artista:'Mercedes Sosa',anio:1969,letra:'Por la blanda arena\nQue lame el mar',nota:'6/8 pausado, acento 1 y 4.'}},
 {id:'chacarera',cat:'FOLKLORE',nombre:'Chacarera',compas:'6/8',bpm:110,patron:[{a:'strong'},{a:'weak'},{a:'weak'},{a:'strong'},{a:'weak'},{a:'weak'}],ej:{titulo:'Chacarera del 55',artista:'Los Manseros',anio:1975,letra:'Chacarera del 55\nLa que baila mi pueblo',nota:'Bombo legüero.'}},
 {id:'flamenco',cat:'EUROPEO',nombre:'Flamenco Bulería 12',compas:'12 tiempos',bpm:180,patron:[{a:'weak'},{a:'weak'},{a:'medium'},{a:'weak'},{a:'weak'},{a:'strong'},{a:'weak'},{a:'strong'},{a:'weak'},{a:'strong'},{a:'weak'},{a:'strong'}],ej:{titulo:'Entre dos aguas',artista:'Paco de Lucía',anio:1973,letra:'Bulería, bulería\nTan llena de compás',nota:'12 tiempos acentos 12,3,6,8,10.'}},
 {id:'balada',cat:'EUROPEO',nombre:'Balada',compas:'4/4',bpm:72,patron:[{a:'strong'},{a:'weak'},{a:'medium'},{a:'weak'}],ej:{titulo:'Yesterday',artista:'The Beatles',anio:1965,letra:'Yesterday\nAll my troubles seemed so far away',nota:'Balada 4/4 lenta.'}},
];

function App(){
 const [cat,setCat]=useState('ROCK');
 const [sel,setSel]=useState(RITMOS[0]);
 const [bpm,setBpm]=useState(120);
 const [isPlay,setIsPlay]=useState(false);
 const [beat,setBeat]=useState(-1);
 const [sound,setSound]=useState('Click');
 const [vol,setVol]=useState(0.7);
 const [lyric,setLyric]=useState(RITMOS[0].ej.letra);
 const [syls,setSyls]=useState([]);
 const [curSyl,setCurSyl]=useState(-1);
 const [sync,setSync]=useState(false);
 const [speed,setSpeed]=useState(1);
 const [compasCount,setCompasCount]=useState(0);
 const audioRef=useRef(null);
 const timerRef=useRef(null);
 const stepRef=useRef(0);

 useEffect(()=>{ setBpm(sel.bpm); setLyric(sel.ej.letra); setBeat(-1); setCurSyl(-1); stepRef.current=0; },[sel]);
 useEffect(()=>{ if(!audioRef.current) audioRef.current=new (window.AudioContext||window.webkitAudioContext)(); },[]);

 const playTick=(accent)=>{
  const ctx=audioRef.current; if(!ctx) return;
  const o=ctx.createOscillator(); const g=ctx.createGain();
  o.connect(g); g.connect(ctx.destination);
  let freq=600, dur=0.12, v=vol*0.5;
  if(accent==='strong'){freq=sound==='Madera'?1200:1000; dur=0.25; v=vol*1.0}
  else if(accent==='medium'){freq=sound==='Madera'?900:800; dur=0.15; v=vol*0.7}
  else {freq=sound==='Madera'?700:600; dur=0.1; v=vol*0.4}
  if(sound==='Drum'){ if(accent==='strong'){ o.type='sine'; freq=60; dur=0.3;} else if(accent==='medium'){ o.type='square'; freq=200; dur=0.15;} else { o.type='sine'; freq=400; dur=0.08;} }
  o.frequency.value=freq; g.gain.setValueAtTime(v,ctx.currentTime); g.gain.exponentialRampToValueAtTime(0.01,ctx.currentTime+dur);
  o.start(); o.stop(ctx.currentTime+dur);
 };

 useEffect(()=>{
  if(!isPlay){ clearInterval(timerRef.current); return; }
  const interval = 60000 / bpm / (sel.patron.length>8?2:1);
  timerRef.current=setInterval(()=>{
    const idx=stepRef.current % sel.patron.length;
    const ac=sel.patron[idx].a;
    playTick(ac); setBeat(idx);
    if(idx===0) setCompasCount(c=>c+1);
    if(sync && syls.length>0 && stepRef.current % speed===0) setCurSyl(s=> (s+1) % syls.length);
    stepRef.current++;
  }, interval);
  return()=>clearInterval(timerRef.current);
 },[isPlay,bpm,sel,sync,syls,speed,vol,sound]);

 const analyze=()=>{
  const words=lyric.split(/\s+/);
  const syllables=[];
  words.forEach(w=>{
    const clean=w.toLowerCase().replace(/[^a-záéíóúñ]/g,'');
    if(!clean) return;
    const sylCount=Math.max(1,(clean.match(/[aeiouáéíóú]/g)||[]).length);
    if(sylCount<=2) syllables.push({text:w,accent:false});
    else for(let i=0;i<sylCount;i++) syllables.push({text:w+(sylCount>1?`-${i+1}`:''),accent:i===0});
  });
  syllables.forEach((s,i)=>{ if(i%3===0) s.accent=true; });
  setSyls(syllables); setCurSyl(-1);
 };

 const filtered=RITMOS.filter(r=>r.cat===cat);
 return (
  <div>
    <div className="header">
      <h1>Maestra V4 | Bases Conocidas + Metrónomo Sync</h1>
      <p>José Altimiras Lampre — Santiago 2026 | Vertical sin solapes | {sel.nombre} • {sel.compas}</p>
    </div>
    <div className="container">
      <div><div className="small">CATEGORÍAS</div><div className="cat-bar">{['ROCK','RAICES','RIO DE LA PLATA','TROPICAL','URBANO','FOLKLORE','EUROPEO'].map(c=><button key={c} className={'cat-btn '+(cat===c?'active':'')} onClick={()=>setCat(c)}>{c}</button>)}</div></div>
      <div className="grid">{filtered.map(r=><div key={r.id} className={'card '+(sel.id===r.id?'sel':'')} onClick={()=>setSel(r)}><h4>{r.nombre}</h4><span>{r.compas} • {r.bpm} BPM • {r.ej.artista}</span></div>)}</div>
      <div className="detail">
        <div><h2 style={{color:'#fff'}}>{sel.nombre} <span className="badge">{sel.compas}</span> <span className="badge">{bpm} BPM</span></h2><p className="small" style={{marginTop:6}}>Patrón: {sel.patron.map(p=>p.a==='strong'?'●':p.a==='medium'?'◐':'○').join(' ')} | {sel.patron.length} pasos</p></div>
        <div className="base-box">
          <h3>🎵 Base de Creación — Canción Referente</h3>
          <div><b>{sel.ej.titulo}</b> — {sel.ej.artista} ({sel.ej.anio})</div>
          <div className="lyric">{sel.ej.letra}</div>
          <div className="small" style={{color:'#a78bfa'}}>Nota rítmica: {sel.ej.nota}</div>
          <div className="controls">
            <button className="btn btn-primary" onClick={()=>{setLyric(sel.ej.letra); setSyls([]);}}>Cargar como plantilla editable</button>
            <button className="btn btn-ghost" onClick={()=>{setLyric(''); setSyls([]);}}>Crear original desde cero</button>
          </div>
        </div>
        <div className="metronome">
          <div style={{display:'flex',flexWrap:'wrap',gap:8,alignItems:'center'}}>
            <button className="btn btn-primary" style={{minWidth:110}} onClick={()=>{if(audioRef.current && audioRef.current.state==='suspended') audioRef.current.resume(); setIsPlay(!isPlay); if(!isPlay) setCompasCount(0);}}>{isPlay?'■ STOP':'▶ PLAY'}</button>
            <span className="badge">Compás {compasCount}</span><span className="badge">Beat {beat>=0?beat+1:'-'}/{sel.patron.length}</span>
            <label className="small">Sonido: <select value={sound} onChange={e=>setSound(e.target.value)} style={{marginLeft:6,background:'#1a1a2a',color:'#fff',border:'1px solid #333',borderRadius:8,padding:6}}><option>Click</option><option>Madera</option><option>Drum</option></select></label>
          </div>
          <div className="beats">{sel.patron.map((p,i)=><div key={i} className={'beat '+p.a+' '+(beat===i?'active':'')}>{i+1}</div>)}</div>
          <div className="controls">
            <span className="small">BPM</span><button className="btn btn-ghost" onClick={()=>setBpm(b=>Math.max(40,b-5))}>-5</button><button className="btn btn-ghost" onClick={()=>setBpm(b=>Math.max(40,b-1))}>-1</button><input type="range" min="40" max="240" value={bpm} onChange={e=>setBpm(parseInt(e.target.value))}/><button className="btn btn-ghost" onClick={()=>setBpm(b=>Math.min(240,b+1))}>+1</button><button className="btn btn-ghost" onClick={()=>setBpm(b=>Math.min(240,b+5))}>+5</button><input type="number" value={bpm} onChange={e=>setBpm(parseInt(e.target.value)||90)} style={{width:70,background:'#1a1a2a',color:'#fff',border:'1px solid #333',borderRadius:8,padding:8}}/>
          </div>
          <div className="controls"><button className="btn btn-ghost" onClick={()=>{const now=Date.now(); window._taps=window._taps||[]; window._taps.push(now); if(window._taps.length>4) window._taps.shift(); if(window._taps.length>=2){const diffs=[]; for(let i=1;i<window._taps.length;i++) diffs.push(window._taps[i]-window._taps[i-1]); const avg=diffs.reduce((a,b)=>a+b,0)/diffs.length; const nbpm=Math.round(60000/avg); if(nbpm>=40&&nbpm<=240) setBpm(nbpm);}}}>TAP TEMPO</button><span className="small">Vol</span><input type="range" min="0" max="1" step="0.05" value={vol} onChange={e=>setVol(parseFloat(e.target.value))}/></div>
        </div>
        <div>
          <h3 style={{color:'#c4b5fd',marginBottom:8}}>📝 Formación de Frases — Editor Sincrónico (modificable)</h3>
          <textarea className="textarea" value={lyric} onChange={e=>setLyric(e.target.value)} placeholder="Escribe o carga plantilla..."></textarea>
          <div className="controls" style={{marginTop:10}}>
            <button className="btn btn-primary" onClick={analyze}>Analizar sílabas + semáforo</button>
            <label style={{display:'flex',alignItems:'center',gap:6}}><input type="checkbox" checked={sync} onChange={e=>setSync(e.target.checked)}/> Sync con metrónomo</label>
            <select value={speed} onChange={e=>setSpeed(parseInt(e.target.value))} style={{background:'#1a1a2a',color:'#fff',border:'1px solid #333',borderRadius:8,padding:6}}><option value="1">Sílaba cada tick</option><option value="2">Cada 2 ticks</option></select>
            <span className="small">{syls.length} sílabas</span>
          </div>
          <div className="syllables">{syls.map((s,i)=><span key={i} className={'syl '+(curSyl===i?'cur '+(s.accent?'strong':''):'')}>{s.text}</span>)}</div>
          {curSyl>=0 && syls[curSyl] && (<div style={{marginTop:12,padding:12,background:'#1e1b3a',borderRadius:10,textAlign:'center',fontSize:20}}><b style={{color:syls[curSyl].accent?'#ef4444':'#fde047'}}>{syls[curSyl].text}</b><span className="small" style={{marginLeft:10}}>{curSyl+1}/{syls.length}</span></div>)}
        </div>
      </div>
    </div>
  </div>
 );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
