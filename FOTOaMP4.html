<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Congelar Video con Foto 1:1 (MP4 + Progreso)</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            max-width: 600px;
            width: 100%;
            background: #1e1e1e;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
        }
        h2 { text-align: center; color: #4CAF50; margin-top: 0; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #b0bec5; }
        input[type="file"] { width: 100%; padding: 8px; background: #2d2d2d; border: 1px solid #444; color: #fff; border-radius: 5px; box-sizing: border-box; }
        .preview-container { display: flex; gap: 10px; margin-top: 10px; }
        .preview-box { flex: 1; text-align: center; background: #252525; padding: 8px; border-radius: 5px; border: 1px dashed #444; }
        video, img { max-width: 100%; max-height: 120px; border-radius: 4px; display: block; margin: 0 auto; object-fit: contain; }
        button { width: 100%; background-color: #4CAF50; color: white; border: none; padding: 12px; font-size: 16px; font-weight: bold; border-radius: 5px; cursor: pointer; }
        button:hover { background-color: #45a049; }
        button:disabled { background-color: #555; cursor: not-allowed; }
        #status { margin-top: 15px; text-align: center; font-weight: bold; color: #ff9800; }
        
        /* Estilos de la barra de progreso */
        .progress-bar-container {
            width: 100%;
            background-color: #2d2d2d;
            border-radius: 5px;
            margin-top: 15px;
            overflow: hidden;
            display: none;
            border: 1px solid #444;
        }
        .progress-bar {
            width: 0%;
            height: 20px;
            background-color: #4CAF50;
            text-align: center;
            line-height: 20px;
            color: white;
            font-size: 12px;
            font-weight: bold;
            transition: width 0.1s linear;
        }

        canvas { display: none; }
    </style>
</head>
<body>

<div class="container">
    <h2>Congelar Video (Desde el segundo 1 en MP4)</h2>
    <p style="text-align: center; font-size: 13px; color: #999;">Genera el video final en MP4 con barra de progreso.</p>

    <div class="form-group">
        <label>1. Archivo de Video:</label>
        <input type="file" id="videoInput" accept="video/*">
    </div>

    <div class="form-group">
        <label>2. Foto 1:1:</label>
        <input type="file" id="photoInput" accept="image/*">
    </div>

    <div class="preview-container">
        <div class="preview-box">
            <span>Video</span>
            <video id="videoPreview" style="display:none;"></video>
        </div>
        <div class="preview-box">
            <span>Foto 1:1</span>
            <img id="photoPreview" style="display:none;" alt="Foto">
        </div>
    </div>

    <button id="processBtn" disabled style="margin-top: 20px;">Generar y Descargar MP4</button>
    
    <div class="progress-bar-container" id="progressContainer">
        <div class="progress-bar" id="progressBar">0%</div>
    </div>
    
    <div id="status"></div>

    <div id="downloadContainer" style="margin-top: 15px; text-align: center; display: none;">
        <a id="downloadLink"><button style="background-color: #2196F3;">Descargar Video MP4</button></a>
    </div>
</div>

<canvas id="canvas"></canvas>

<script>
    const videoInput = document.getElementById('videoInput');
    const photoInput = document.getElementById('photoInput');
    const videoPreview = document.getElementById('videoPreview');
    const photoPreview = document.getElementById('photoPreview');
    const processBtn = document.getElementById('processBtn');
    const statusDiv = document.getElementById('status');
    const progressContainer = document.getElementById('progressContainer');
    const progressBar = document.getElementById('progressBar');
    const downloadContainer = document.getElementById('downloadContainer');
    const downloadLink = document.getElementById('downloadLink');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    let videoFile = null;
    let photoImg = new Image();
    let photoLoaded = false;

    videoInput.addEventListener('change', (e) => {
        videoFile = e.target.files[0];
        if (videoFile) {
            videoPreview.src = URL.createObjectURL(videoFile);
            videoPreview.style.display = 'block';
            checkReady();
        }
    });

    photoInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(event) {
                photoImg.src = event.target.result;
                photoImg.onload = () => {
                    photoPreview.src = photoImg.src;
                    photoPreview.style.display = 'block';
                    photoLoaded = true;
                    checkReady();
                }
            }
            reader.readAsDataURL(file);
        }
    });

    function checkReady() {
        if (videoFile && photoLoaded) {
            processBtn.disabled = false;
        }
    }

    processBtn.addEventListener('click', async () => {
        processBtn.disabled = true;
        downloadContainer.style.display = 'none';
        progressContainer.style.display = 'block';
        progressBar.style.width = '0%';
        progressBar.innerText = '0%';
        statusDiv.innerText = "Preparando procesamiento...";

        const vid = document.createElement('video');
        vid.src = URL.createObjectURL(videoFile);
        vid.muted = true;

        await new Promise((resolve) => {
            vid.onloadedmetadata = () => resolve();
        });

        const duration = vid.duration;
        canvas.width = vid.videoWidth || 1280;
        canvas.height = vid.videoHeight || 720;

        const stream = canvas.captureStream(30);
        
        let mediaStream = stream;
        if (vid.captureStream) {
            try {
                const vidStream = vid.captureStream();
                if (vidStream.getAudioTracks().length > 0) {
                    const audioContext = new AudioContext();
                    const source = audioContext.createMediaElementSource(vid);
                    const destination = audioContext.createMediaStreamDestination();
                    source.connect(destination);
                    destination.stream.getAudioTracks().forEach(track => stream.addTrack(track));
                }
            } catch(e) { console.log("Aviso de audio:", e); }
        }

        let recordedChunks = [];
        let recorder;

        const mimeTypes = [
            'video/mp4;codecs=avc1.42E01E,mp4a.40.2',
            'video/mp4;codecs=avc1',
            'video/mp4'
        ];
        
        let selectedMimeType = '';
        for (let type of mimeTypes) {
            if (MediaRecorder.isTypeSupported(type)) {
                selectedMimeType = type;
                break;
            }
        }

        try {
            recorder = selectedMimeType ? new MediaRecorder(mediaStream, { mimeType: selectedMimeType }) : new MediaRecorder(mediaStream);
        } catch (e) {
            recorder = new MediaRecorder(mediaStream);
        }

        recorder.ondataavailable = (event) => {
            if (event.data.size > 0) recordedChunks.push(event.data);
        };

        recorder.onstop = () => {
            const blob = new Blob(recordedChunks, { type: 'video/mp4' });
            const url = URL.createObjectURL(blob);
            downloadLink.href = url;
            downloadLink.download = "video_congelado.mp4";
            downloadContainer.style.display = 'block';
            statusDiv.innerText = "¡Proceso completado con éxito!";
            processBtn.disabled = false;
        };

        statusDiv.innerText = "Renderizando MP4...";
        recorder.start();
        vid.currentTime = 0;
        vid.play();

        function renderFrame() {
            if (vid.paused || vid.ended || vid.currentTime >= duration) {
                vid.pause();
                progressBar.style.width = '100%';
                progressBar.innerText = '100%';
                setTimeout(() => recorder.stop(), 200);
                return;
            }

            // Calcular porcentaje actual de avance
            let percent = Math.min(Math.floor((vid.currentTime / duration) * 100), 100);
            progressBar.style.width = percent + '%';
            progressBar.innerText = percent + '%';

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (vid.currentTime <= 1.0) {
                // Primer segundo: video original
                ctx.drawImage(vid, 0, 0, canvas.width, canvas.height);
            } else {
                // Del segundo 1 en adelante: foto 1:1 centrada
                ctx.fillStyle = "#000000";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                const h = canvas.height;
                const w = h; 
                const x = (canvas.width - w) / 2;
                const y = 0;
                
                ctx.drawImage(photoImg, x, y, w, h);
            }

            requestAnimationFrame(renderFrame);
        }

        renderFrame();
    });
</script>

</body>
</html>
