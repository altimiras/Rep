<!-- VERSION: 1.0.4 - GitHub Pages Compatible -->
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Convertidor MP3 a MP4 v1.0.4</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #121212;
      color: #e0e0e0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 1.5rem;
      font-size: 18px;
    }
    .card {
      background: #1e1e1e;
      padding: 2.5rem 2rem;
      border-radius: 16px;
      box-shadow: 0 12px 32px rgba(0,0,0,0.6);
      width: 100%;
      max-width: 640px;
      text-align: center;
    }
    .version-tag {
      display: inline-block;
      background: #2563eb;
      color: #ffffff;
      font-size: 0.85rem;
      font-weight: bold;
      padding: 4px 10px;
      border-radius: 6px;
      vertical-align: middle;
      margin-left: 8px;
    }
    h2 { margin-top: 0; color: #fff; font-size: 2rem; display: flex; align-items: center; justify-content: center; }
    input[type="file"] { display: none; }
    .btn {
      display: block;
      background: #3b82f6;
      color: white;
      padding: 18px 24px;
      border-radius: 12px;
      cursor: pointer;
      font-weight: bold;
      font-size: 1.25rem;
      margin-top: 1.5rem;
      border: none;
      width: 100%;
      text-decoration: none;
    }
    .btn:hover { background: #2563eb; }
    .btn:disabled { background: #4b5563; cursor: not-allowed; opacity: 0.7; }
    .engine-badge {
      display: inline-block;
      padding: 8px 18px;
      border-radius: 20px;
      font-size: 1rem;
      font-weight: bold;
      margin-bottom: 1.5rem;
      background: #065f46;
      color: #34d399;
    }
    .progress-container {
      width: 100%;
      background-color: #374151;
      border-radius: 12px;
      overflow: hidden;
      margin-top: 1.5rem;
      display: none;
      height: 28px;
      position: relative;
    }
    .progress-bar {
      width: 0%;
      height: 100%;
      background-color: #10b981;
      transition: width 0.1s linear;
    }
    .progress-text {
      position: absolute;
      width: 100%;
      top: 0; left: 0;
      font-size: 1rem;
      font-weight: bold;
      line-height: 28px;
      color: #ffffff;
      text-shadow: 0 1px 3px rgba(0,0,0,0.9);
    }
    #status { margin-top: 1.5rem; font-size: 1.1rem; color: #cbd5e1; word-break: break-all; }
    #preview { margin-top: 1.5rem; max-width: 260px; width: 100%; border-radius: 12px; display: none; margin: 1.5rem auto 0; }
    canvas { display: none; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jsmediatags/3.9.5/jsmediatags.min.js"></script>
</head>
<body>

<div class="card">
  <h2>MP3 a MP4 <span class="version-tag">v1.0.4</span></h2>
  <div class="engine-badge">Motor Web Audio Listo</div>
  
  <br>
  <label for="audioFile" class="btn">Seleccionar Archivo MP3</label>
  <input type="file" id="audioFile" accept="audio/mp3, audio/*">
  
  <img id="preview" alt="Carátula detectada">
  
  <div class="progress-container" id="progressContainer">
    <div class="progress-bar" id="progressBar"></div>
    <div class="progress-text" id="progressText">0%</div>
  </div>

  <div id="status">Selecciona un archivo MP3 para comenzar.</div>
  
  <button id="convertBtn" class="btn" style="background: #10b981; display: none;">Convertir a MP4</button>
  <a id="downloadLink" class="btn" style="background: #8b5cf6; display: none;">Descargar Video (.mp4)</a>
  
  <canvas id="canvas" width="1280" height="720"></canvas>
</div>

<script>
  const jsMediaTags = window.jsmediatags;
  const fileInput = document.getElementById('audioFile');
  const status = document.getElementById('status');
  const convertBtn = document.getElementById('convertBtn');
  const downloadLink = document.getElementById('downloadLink');
  const preview = document.getElementById('preview');
  const progressContainer = document.getElementById('progressContainer');
  const progressBar = document.getElementById('progressBar');
  const progressText = document.getElementById('progressText');
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');

  let selectedFile = null;
  let coverImage = null;

  fileInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;

    selectedFile = file;
    status.innerText = `Lectura de metadatos: ${file.name}...`;
    convertBtn.style.display = "none";
    downloadLink.style.display = "none";
    preview.style.display = "none";
    progressContainer.style.display = "none";
    coverImage = null;

    jsMediaTags.read(file, {
      onSuccess: function(tag) {
        const picture = tag.tags.picture;
        if (picture) {
          let base64String = "";
          for (let i = 0; i < picture.data.length; i++) {
            base64String += String.fromCharCode(picture.data[i]);
          }
          const base64 = "data:" + picture.format + ";base64," + window.btoa(base64String);
          
          coverImage = new Image();
          coverImage.onload = () => {
            preview.src = base64;
            preview.style.display = "block";
            status.innerText = "Carátula detectada. Listo para convertir.";
            convertBtn.style.display = "block";
          };
          coverImage.src = base64;
        } else {
          status.innerText = "Sin carátula integrada. Se creará con fondo sólido.";
          convertBtn.style.display = "block";
        }
      },
      onError: function() {
        status.innerText = "Archivo cargado correctamente.";
        convertBtn.style.display = "block";
      }
    });
  });

  convertBtn.addEventListener('click', async () => {
    if (!selectedFile) return;

    convertBtn.disabled = true;
    progressContainer.style.display = "block";
    progressBar.style.width = "0%";
    progressText.innerText = "0%";
    status.innerText = "Procesando...";

    if (coverImage) {
      ctx.fillStyle = "#000000";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      const scale = Math.min(canvas.width / coverImage.width, canvas.height / coverImage.height);
      const w = coverImage.width * scale;
      const h = coverImage.height * scale;
      const x = (canvas.width - w) / 2;
      const y = (canvas.height - h) / 2;
      ctx.drawImage(coverImage, x, y, w, h);
    } else {
      ctx.fillStyle = "#1e293b";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "#ffffff";
      ctx.font = "36px sans-serif";
      ctx.textAlign = "center";
      ctx.fillText(selectedFile.name, canvas.width / 2, canvas.height / 2);
    }

    const audioContext = new (window.AudioContext || window.webkitAudioContext)();
    if (audioContext.state === 'suspended') await audioContext.resume();

    const arrayBuffer = await selectedFile.arrayBuffer();
    const audioBuffer = await audioContext.decodeAudioData(arrayBuffer);

    const mediaStreamDest = audioContext.createMediaStreamDestination();
    const sourceNode = audioContext.createBufferSource();
    sourceNode.buffer = audioBuffer;
    sourceNode.connect(mediaStreamDest);

    const canvasStream = canvas.captureStream(1);
    const combinedStream = new MediaStream([
      ...canvasStream.getVideoTracks(),
      ...mediaStreamDest.stream.getAudioTracks()
    ]);

    const mimeTypes = ['video/mp4;codecs=avc1.42E01E,mp4a.40.2', 'video/mp4;codecs=h264,aac', 'video/mp4', 'video/webm'];
    let selectedMime = mimeTypes.find(type => MediaRecorder.isTypeSupported(type)) || 'video/webm';

    const mediaRecorder = new MediaRecorder(combinedStream, { mimeType: selectedMime });
    const chunks = [];
    
    mediaRecorder.ondataavailable = e => chunks.push(e.data);
    
    mediaRecorder.onstop = () => {
      const blob = new Blob(chunks, { type: selectedMime });
      const videoUrl = URL.createObjectURL(blob);
      
      downloadLink.href = videoUrl;
      downloadLink.download = selectedFile.name.replace(/\.[^/.]+$/, "") + ".mp4";
      downloadLink.style.display = "block";
      status.innerText = "¡Proceso finalizado!";
      convertBtn.disabled = false;
      progressBar.style.width = "100%";
      progressText.innerText = "100%";
    };

    sourceNode.start(0);
    mediaRecorder.start();

    const startTime = audioContext.currentTime;
    const duration = audioBuffer.duration;

    const interval = setInterval(() => {
      const elapsed = audioContext.currentTime - startTime;
      const percent = Math.min(Math.round((elapsed / duration) * 100), 100);
      progressBar.style.width = `${percent}%`;
      progressText.innerText = `${percent}%`;

      if (elapsed >= duration) {
        clearInterval(interval);
        mediaRecorder.stop();
        sourceNode.stop();
      }
    }, 100);
  });
</script>

</body>
</html>
